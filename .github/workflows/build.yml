name: Build ESPHome base container image

on:
  workflow_dispatch:


permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.base }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base:
          - debian
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0
        with:
          platforms: linux/arm/v7


      - name: Log in to the GitHub container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get tag
        id: get_tag
        run: |-
          echo version="2025.04.0" >> $GITHUB_OUTPUT

      - name: Build base image
        uses: docker/build-push-action@v6.15.0
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ matrix.base }}
          file: ./${{ matrix.base }}/Dockerfile
          platforms: linux/arm/v7
          target: base
          cache-from: type=registry,ref=ghcr.io/iHost-Open-Source-Project/esphome-docker-base:cache-${{ matrix.base }}
          cache-to: ${{ github.event_name == 'release' && format('type=registry,ref=ghcr.io/iHost-Open-Source-Project/esphome-docker-base:cache-{0},mode=max', matrix.base) || '' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/iHost-Open-Source-Project/esphome-docker-base:${{ matrix.base }}-${{ steps.get_tag.outputs.version }}

      - name: Build ha-addon image
        uses: docker/build-push-action@v6.15.0
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ matrix.base }}
          file: ./${{ matrix.base }}/Dockerfile
          platforms: linux/arm/v7
          target: ha-addon
          cache-from: type=registry,ref=ghcr.io/esphome/docker-base:cache-${{ matrix.base }}
          cache-to: ${{ github.event_name == 'release' && format('type=registry,ref=ghcr.io/esphome/docker-base:cache-{0},mode=max', matrix.base) || '' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/esphome/docker-base:${{ matrix.base }}-ha-addon-${{ steps.get_tag.outputs.version }}
